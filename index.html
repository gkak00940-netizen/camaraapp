<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3557">
  <title>업무 사진</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="업무 사진">
  <link rel="stylesheet" href="style.css?v=11">
  <script src="config.js?v=11" defer></script>
  <script src="relay.js?v=11" defer></script>
  <script src="app.js?v=11" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-row"><span class="app-name">업무 사진</span><button type="button" id="install-app" class="ghost small" hidden>앱 설치</button></div>
    <h1 class="sr-only">업무 사진</h1>
    <!-- 목적 상자: 누르면 저장한 목적 목록이 펼쳐지고, 새로 입력하면 추가돼요 -->
    <form id="purpose-form" class="purpose-form" autocomplete="off">
      <label for="purpose-name" class="purpose-label">촬영 목적</label>
      <div class="combo">
        <input id="purpose-name" maxlength="30" placeholder="예: 3층 배관 점검" enterkeyhint="done"
          role="combobox" aria-expanded="false" aria-controls="purposes" aria-autocomplete="list">
        <button type="button" id="purpose-toggle" class="combo-toggle" aria-label="목적 목록 열기" tabindex="-1">▾</button>
        <ul id="purposes" class="combo-list" role="listbox" aria-label="저장한 목적" hidden></ul>
      </div>
    </form>
  </header>

  <main>
    <section class="card camera-card" aria-label="사진 찍기">
      <button type="button" id="viewfinder" class="viewfinder" aria-label="카메라 켜기">
        <span class="placeholder"><span class="camera-symbol" aria-hidden="true">◎</span><span id="placeholder-text">눌러서 카메라 켜기</span></span>
      </button>
    </section>

    <p id="notice" class="notice" role="status">불러오고 있어요…</p>

    <section class="card" aria-labelledby="album-title">
      <div class="heading"><h2 id="album-title">사진 보관함</h2><span id="album-count" class="count">0장</span></div>
      <button type="button" id="import-photos" class="import-btn">＋ 받은 사진·영상 가져오기</button>
      <input type="file" id="import-input" accept="image/*,video/*" multiple hidden>
      <div class="view-tabs" role="tablist" aria-label="사진 보기 방식">
        <button type="button" role="tab" class="view-tab" data-view="purpose" aria-selected="true">목적별</button>
        <button type="button" role="tab" class="view-tab" data-view="date" aria-selected="false">날짜별</button>
      </div>
      <p id="empty" class="empty">목적을 고르고 사진을 찍어 보세요.</p>
      <div id="album" class="album"></div>
      <p class="help select-help">사진 왼쪽 위 네모를 누르면 화면 아래에 보내기·삭제가 나와요.</p>
    </section>
    <p id="storage-info" class="foot"></p>
    <p id="pc-link" class="foot" hidden>회사 PC에서는 <a href="pc.html">PC 받기 화면</a>을 열어 설치해 주세요.</p>
  </main>

  <!-- 사진을 고르면 화면 아래에 바로 나오는 보내기·삭제 -->
  <section id="action-bar" class="action-bar" hidden aria-label="선택한 사진 보내기와 삭제">
    <div class="bar-top">
      <strong id="selection-count">0장 선택</strong>
      <button type="button" id="clear-selection" class="small">선택 해제</button>
    </div>
    <p id="size-note" class="size-note" role="status"></p>
    <div class="send-box" role="group" aria-labelledby="send-title">
      <p class="send-title" id="send-title"><span class="send-arrow" aria-hidden="true">↗</span> 보내기 <span class="send-sub">보낼 곳을 누르세요</span></p>
      <button type="button" id="send-pc" class="send-pc" hidden><span class="pc-icon" aria-hidden="true">🖥</span><span><b id="send-pc-label">회사 PC로 보내기</b><small>PC에 목적별 폴더로 저장돼요</small></span></button>
      <div class="share-grid">
        <button type="button" class="share" data-target="drive"><span class="share-icon" aria-hidden="true">▲</span>드라이브</button>
        <button type="button" class="share" data-target="kakao"><span class="share-icon" aria-hidden="true">●</span>카카오톡</button>
        <button type="button" class="share" data-target="email"><span class="share-icon" aria-hidden="true">✉</span>이메일</button>
        <button type="button" class="share" data-target="sms"><span class="share-icon" aria-hidden="true">✆</span>문자</button>
        <button type="button" class="share" data-target="other"><span class="share-icon" aria-hidden="true">⋯</span>다른 앱</button>
      </div>
    </div>
    <p id="share-status" class="share-status" role="status" hidden></p>
    <div id="share-fallback" class="share-fallback" hidden>
      <button type="button" id="open-chrome" class="accent" hidden>크롬으로 열기</button>
      <button type="button" id="save-photos">선택한 사진 휴대폰에 저장</button>
    </div>
    <button type="button" id="delete-selected" class="delete-link">🗑 선택한 사진 삭제</button>
  </section>

  <div id="share-hint" class="share-hint" hidden></div>

  <!-- 카메라: 폰 화면 전체 -->
  <div id="camera-screen" class="camera-screen" hidden role="dialog" aria-label="카메라">
    <video id="camera" autoplay playsinline muted></video>
    <span id="flash" class="flash" aria-hidden="true"></span>
    <div class="cam-top"><span id="cam-purpose" class="cam-purpose"></span><button type="button" id="stop-camera" class="cam-close" aria-label="카메라 닫기">✕</button></div>
    <p id="cam-toast" class="cam-toast" role="status" hidden></p>
    <p id="rec-timer" class="rec-timer" hidden><span class="rec-dot" aria-hidden="true"></span><span id="rec-time">00:00</span><small id="rec-size"></small></p>
    <div class="cam-bottom">
      <div class="cam-modes" role="radiogroup" aria-label="촬영 종류">
        <button type="button" class="cam-mode" data-mode="photo" role="radio" aria-checked="true">사진</button>
        <button type="button" class="cam-mode" data-mode="video" role="radio" aria-checked="false">동영상</button>
      </div>
      <span class="cam-side"><img id="last-shot" class="last-shot" alt="" hidden></span>
      <button type="button" id="capture" class="shutter" aria-label="사진 찍기"><span></span></button>
      <span id="shot-count" class="cam-side shot-count">0장</span>
    </div>
  </div>

  <dialog id="photo-dialog"><div class="dialog-top"><p id="large-caption"></p><button type="button" id="close-photo">닫기</button></div><img id="large-photo" alt="크게 본 사진"><video id="large-video" controls playsinline hidden></video></dialog>
  <!-- 받은 사진을 어느 목적에 넣을지 고르기 -->
  <dialog id="import-dialog" aria-labelledby="import-title">
    <h2 id="import-title">사진을 어느 목적에 넣을까요?</h2>
    <div class="import-preview" id="import-preview"></div>
    <div id="import-purposes" class="import-purposes" role="radiogroup" aria-label="넣을 목적"></div>
    <label class="import-new"><span>새 목적으로 넣기</span><input id="import-new-name" maxlength="30" placeholder="새 목적 이름" autocomplete="off"></label>
    <p id="import-status" class="help" role="status"></p>
    <div class="dialog-actions"><button type="button" id="cancel-import">취소</button><button type="button" id="confirm-import" class="accent">넣기</button></div>
  </dialog>
  <!-- 목적 이름 바꾸기 -->
  <dialog id="rename-dialog" aria-labelledby="rename-title">
    <form id="rename-form" method="dialog">
      <h2 id="rename-title">목적 이름 바꾸기</h2>
      <p id="rename-old" class="help"></p>
      <input id="rename-input" class="text-input" maxlength="30" autocomplete="off" enterkeyhint="done" aria-label="새 목적 이름">
      <p id="rename-status" class="help" role="status"></p>
      <div class="dialog-actions"><button type="button" id="cancel-rename">취소</button><button type="submit" class="accent">바꾸기</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog"><h2 id="delete-title">사진을 지울까요?</h2><p id="delete-description"></p><p>지운 것은 되돌릴 수 없어요. 이미 보낸 사진에는 영향이 없어요.</p><div class="dialog-actions"><button type="button" id="cancel-delete">취소</button><button type="button" id="confirm-delete" class="danger">삭제</button></div></dialog>
</body>
</html>
